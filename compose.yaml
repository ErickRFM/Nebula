name: nebula-local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nebula_local
      POSTGRES_PASSWORD: nebula_dev_password
      POSTGRES_DB: nebula
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nebula_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula_local -d nebula"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nebula_pgdata:
